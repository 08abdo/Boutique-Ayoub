<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PICKSY ADMIN | تسجيل الدخول</title>
    <link rel="stylesheet" href="admin-style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="login-body">
    <div class="login-card">
      <h2>تسجيل الدخول <span>لوحة الأدمن</span></h2>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">البريد الإلكتروني:</label>
          <input
            type="email"
            id="email"
            required
            placeholder="admin@picksy.com"
          />
        </div>

        <div class="form-group">
          <label for="password">كلمة المرور:</label>
          <input
            type="password"
            id="password"
            required
            placeholder="••••••••"
          />
        </div>

        <button type="submit" class="submit-btn" id="loginBtn">دخول</button>
      </form>

      <div id="loginStatus" class="status-msg"></div>
    </div>

    <script>
      const API_URL = "http://localhost:5000/api/auth/login";

      // التحقق التلقائي: إذا كان الأدمن مسجل الدخول مسبقاً يتم توجيهه مباشرة
      if (localStorage.getItem("adminToken")) {
        window.location.href = "index.html";
      }

      document
        .getElementById("loginForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const email = document.getElementById("email").value.trim();
          const password = document.getElementById("password").value;
          const statusMsg = document.getElementById("loginStatus");
          const loginBtn = document.getElementById("loginBtn");

          // إعادة ضبط حالة الواجهة
          statusMsg.className = "status-msg";
          statusMsg.style.display = "none";
          loginBtn.disabled = true;
          loginBtn.innerText = "جاري التحقق...";

          // 1. التحقق السريع من البيانات الثابتة للأدمن
          if (email === "admin@picksy.com" && password === "admin1234") {
            localStorage.setItem("adminToken", "picksy-admin-secret-token-123");

            statusMsg.className = "status-msg success";
            statusMsg.innerText = "تم تسجيل الدخول بنجاح! جاري التوجيه...";
            statusMsg.style.display = "block";

            setTimeout(() => {
              window.location.href = "index.html";
            }, 600);
            return;
          }

          // 2. التحقق عبر الـ Backend (Node.js + Supabase Auth)
          try {
            const res = await fetch(API_URL, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ email, password }),
            });

            const data = await res.json();

            if (res.ok && data.success) {
              localStorage.setItem(
                "adminToken",
                data.token || "picksy-admin-secret-token-123",
              );
              statusMsg.className = "status-msg success";
              statusMsg.innerText = "تم تسجيل الدخول بنجاح! جاري التوجيه...";
              statusMsg.style.display = "block";

              setTimeout(() => {
                window.location.href = "index.html";
              }, 600);
            } else {
              throw new Error(
                data.message || "البريد الإلكتروني أو كلمة المرور غير صحيحة!",
              );
            }
          } catch (err) {
            statusMsg.className = "status-msg error";
            statusMsg.innerText =
              err.message || "عذراً، تعذر الاتصال بالسيرفر!";
            statusMsg.style.display = "block";
            loginBtn.disabled = false;
            loginBtn.innerText = "دخول";
          }
        });
    </script>
  </body>
</html>
